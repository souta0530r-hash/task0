<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Card Battler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .card {
            transition: all 0.2s ease-in-out;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .card.selected {
            border-color: #fbbf24;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            transform: translateY(-10px);
        }
        .card.enemy-targetable:hover {
            border-color: #ef4444;
            cursor: crosshair;
        }
        .slot {
            transition: background-color 0.2s;
        }
        .slot.highlight {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            cursor: pointer;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2d3748; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <!-- ヘッダー / ログイン情報 -->
    <header class="bg-gray-900 border-b border-gray-700 p-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
            Card Battler
        </h1>
        <div id="auth-section" class="flex items-center gap-4">
            <button id="btn-login" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">
                Googleでログイン
            </button>
            <div id="user-info" class="hidden flex items-center gap-3">
                <div class="text-right text-sm">
                    <p id="user-name" class="font-bold"></p>
                    <p class="text-gray-400">勝利数: <span id="user-wins" class="text-yellow-400 font-bold">0</span></p>
                </div>
                <img id="user-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-gray-600">
                <button id="btn-logout" class="text-xs bg-gray-700 hover:bg-gray-600 py-1 px-2 rounded transition">ログアウト</button>
            </div>
        </div>
    </header>

    <!-- メインゲームエリア -->
    <main id="game-area" class="flex-1 flex flex-col relative opacity-50 pointer-events-none transition-opacity duration-500">
        <!-- ログイン要求オーバーレイ -->
        <div id="login-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-20">
            <div class="text-center bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 max-w-md w-full mx-4">
                <h2 class="text-2xl font-bold mb-4">バトルを開始するにはログインしてください</h2>
                <p class="text-gray-400 mb-6">対戦記録やデッキ情報が保存されます。</p>
            </div>
        </div>

        <!-- 敵のエリア (上部) -->
        <div class="flex-1 flex flex-col justify-end items-center p-4 gap-4 border-b border-gray-800 bg-gray-800 bg-opacity-30">
            <div class="flex justify-between w-full max-w-3xl items-center px-4">
                <div class="text-center">
                    <p class="text-red-400 font-bold">Enemy AI</p>
                    <p class="text-2xl font-black">HP: <span id="enemy-hp">20</span></p>
                </div>
                <!-- 敵の手札 (裏向き表示) -->
                <div id="enemy-hand" class="flex gap-2"></div>
            </div>
            <!-- 敵のフィールド -->
            <div id="enemy-field" class="flex gap-4 min-h-[120px]">
                <div class="slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700">Slot</div>
                <div class="slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700">Slot</div>
                <div class="slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700">Slot</div>
            </div>
        </div>

        <!-- プレイヤーのエリア (下部) -->
        <div class="flex-1 flex flex-col justify-start items-center p-4 gap-4 bg-gray-900 bg-opacity-50">
            <!-- プレイヤーのフィールド -->
            <div id="player-field" class="flex gap-4 min-h-[120px]">
                <div class="slot player-slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700" data-index="0">Slot</div>
                <div class="slot player-slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700" data-index="1">Slot</div>
                <div class="slot player-slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-700" data-index="2">Slot</div>
            </div>
            
            <div class="flex justify-between w-full max-w-3xl items-center px-4 mt-auto">
                <div class="text-center">
                    <p class="text-blue-400 font-bold">You</p>
                    <p class="text-2xl font-black">HP: <span id="player-hp">20</span></p>
                </div>
                <button id="btn-end-turn" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition transform hover:scale-105 hidden">
                    ターン終了
                </button>
            </div>
            
            <!-- プレイヤーの手札 -->
            <div id="player-hand" class="flex gap-2 flex-wrap justify-center max-w-3xl min-h-[140px] p-2 bg-gray-800 rounded-xl border border-gray-700 w-full relative">
                <!-- 手札がここに入る -->
                <p class="absolute inset-0 flex items-center justify-center text-gray-500 pointer-events-none">手札</p>
            </div>
        </div>
    </main>

    <!-- メッセージモーダル (alertの代わり) -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="modal-content">
            <h2 id="modal-title" class="text-2xl font-bold mb-4 text-center">Title</h2>
            <p id="modal-desc" class="text-gray-300 text-center mb-6">Message Description</p>
            <div class="flex justify-center">
                <button id="btn-modal-close" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded-lg transition">
                    OK
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (ユーザー提供の情報)
        const firebaseConfig = {
            apiKey: "AIzaSyCh5NnSyKq648pI-xLwnG-7s7Ogl5vDG-U",
            authDomain: "task0-59261.firebaseapp.com",
            projectId: "task0-59261",
            storageBucket: "task0-59261.firebasestorage.app",
            messagingSenderId: "82069197460",
            appId: "1:82069197460:web:d0a693e1f3d5ffc5fd5a81"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // カードデータ
        const CARD_DB = [
            { id: 1, name: "炎のトカゲ", emoji: "🦎", atk: 2, hp: 2, color: "bg-red-900 border-red-500" },
            { id: 2, name: "森の妖精", emoji: "🧚", atk: 1, hp: 3, color: "bg-green-900 border-green-500" },
            { id: 3, name: "水の精霊", emoji: "💧", atk: 2, hp: 4, color: "bg-blue-900 border-blue-500" },
            { id: 4, name: "ゴーレム", emoji: "🪨", atk: 3, hp: 5, color: "bg-gray-700 border-gray-500" },
            { id: 5, name: "雷鳥", emoji: "🦅", atk: 4, hp: 1, color: "bg-yellow-900 border-yellow-500" },
            { id: 6, name: "闇の騎士", emoji: "🤺", atk: 5, hp: 3, color: "bg-purple-900 border-purple-500" }
        ];

        // ゲーム状態
        const gameState = {
            playerHp: 20,
            enemyHp: 20,
            playerHand: [],
            enemyHandCount: 0,
            playerField: [null, null, null],
            enemyField: [null, null, null],
            turn: 'player', // 'player' or 'enemy'
            selectedCardIndex: null, // 手札で選択中のカード
            attackerIndex: null, // 攻撃対象を選ぶために選択中の自フィールドカード
            hasPlayedCardThisTurn: false
        };

        // DOM要素
        const UI = {
            loginBtn: document.getElementById('btn-login'),
            logoutBtn: document.getElementById('btn-logout'),
            userInfo: document.getElementById('user-info'),
            loginOverlay: document.getElementById('login-overlay'),
            gameArea: document.getElementById('game-area'),
            userName: document.getElementById('user-name'),
            userAvatar: document.getElementById('user-avatar'),
            userWins: document.getElementById('user-wins'),
            
            playerHp: document.getElementById('player-hp'),
            enemyHp: document.getElementById('enemy-hp'),
            playerHand: document.getElementById('player-hand'),
            enemyHand: document.getElementById('enemy-hand'),
            playerField: document.getElementById('player-field'),
            enemyField: document.getElementById('enemy-field'),
            endTurnBtn: document.getElementById('btn-end-turn'),

            modal: document.getElementById('message-modal'),
            modalContent: document.getElementById('modal-content'),
            modalTitle: document.getElementById('modal-title'),
            modalDesc: document.getElementById('modal-desc'),
            modalCloseBtn: document.getElementById('btn-modal-close')
        };

        // モーダル表示関数 (alertの代替)
        function showMessage(title, description, onConfirm = null) {
            UI.modalTitle.textContent = title;
            UI.modalDesc.textContent = description;
            UI.modal.classList.remove('hidden');
            // 少し遅延させてからopacityを上げる（トランジション用）
            setTimeout(() => {
                UI.modal.classList.remove('opacity-0');
                UI.modalContent.classList.remove('scale-95');
            }, 10);

            const closeHandler = () => {
                UI.modal.classList.add('opacity-0');
                UI.modalContent.classList.add('scale-95');
                setTimeout(() => {
                    UI.modal.classList.add('hidden');
                }, 300);
                UI.modalCloseBtn.removeEventListener('click', closeHandler);
                if (onConfirm) onConfirm();
            };
            
            // 古いイベントリスナーを削除するためにクローン
            const newBtn = UI.modalCloseBtn.cloneNode(true);
            UI.modalCloseBtn.parentNode.replaceChild(newBtn, UI.modalCloseBtn);
            UI.modalCloseBtn = newBtn;
            
            UI.modalCloseBtn.addEventListener('click', closeHandler);
        }

        function createCardElement(card, isEnemy = false, index = null, location = 'hand') {
            if (!card) return null;
            
            const div = document.createElement('div');
            // カードの基本スタイル
            div.className = `card w-24 h-32 rounded-lg border-2 flex flex-col justify-between p-2 cursor-pointer shadow-md bg-opacity-90 ${card.color} ${isEnemy ? 'pointer-events-none' : ''}`;
            
            div.innerHTML = `
                <div class="text-xs font-bold text-white truncate text-center">${card.name}</div>
                <div class="text-3xl text-center">${card.emoji}</div>
                <div class="flex justify-between text-sm font-bold bg-black bg-opacity-50 px-1 rounded">
                    <span class="text-yellow-400">⚔️${card.atk}</span>
                    <span class="text-red-400">❤️${card.hp}</span>
                </div>
            `;

            // インタラクション設定
            if (!isEnemy && location === 'hand' && gameState.turn === 'player') {
                div.onclick = () => selectCardFromHand(index);
                if (gameState.selectedCardIndex === index) {
                    div.classList.add('selected');
                }
            } else if (!isEnemy && location === 'field' && gameState.turn === 'player' && !card.hasAttacked) {
                div.onclick = () => selectCardOnFieldForAttack(index);
                if (gameState.attackerIndex === index) {
                    div.classList.add('selected');
                }
                if (card.hasAttacked) {
                    div.classList.add('opacity-50', 'grayscale');
                }
            } else if (isEnemy && location === 'field' && gameState.attackerIndex !== null) {
                // 攻撃対象としてのハイライト
                div.classList.add('enemy-targetable');
                div.classList.remove('pointer-events-none'); // クリック可能に
                div.onclick = () => attackEnemyCard(index);
            }

            return div;
        }

        // 裏向きのカード要素生成
        function createCardBackElement() {
            const div = document.createElement('div');
            div.className = `w-16 h-24 sm:w-20 sm:h-28 rounded-lg border-2 border-gray-600 bg-gradient-to-br from-indigo-900 to-purple-900 shadow-md flex items-center justify-center`;
            div.innerHTML = `<span class="text-2xl opacity-50">?</span>`;
            return div;
        }

        // 空のスロット要素生成
        function createEmptySlotElement(index, isPlayer = true) {
            const div = document.createElement('div');
            div.className = `slot w-24 h-32 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center text-gray-600 text-sm`;
            div.textContent = "Empty";

            if (isPlayer && gameState.selectedCardIndex !== null) {
                div.classList.add('highlight');
                div.onclick = () => playCardToField(index);
            }
            return div;
        }

        function renderGame() {
            // HP
            UI.playerHp.textContent = gameState.playerHp;
            UI.enemyHp.textContent = gameState.enemyHp;

            // プレイヤー手札
            UI.playerHand.innerHTML = '';
            gameState.playerHand.forEach((card, index) => {
                UI.playerHand.appendChild(createCardElement(card, false, index, 'hand'));
            });

            // 敵の手札
            UI.enemyHand.innerHTML = '';
            for(let i=0; i<gameState.enemyHandCount; i++){
                UI.enemyHand.appendChild(createCardBackElement());
            }

            // プレイヤーフィールド
            UI.playerField.innerHTML = '';
            gameState.playerField.forEach((card, index) => {
                if (card) {
                    UI.playerField.appendChild(createCardElement(card, false, index, 'field'));
                } else {
                    UI.playerField.appendChild(createEmptySlotElement(index, true));
                }
            });

            // 敵フィールド
            UI.enemyField.innerHTML = '';
            gameState.enemyField.forEach((card, index) => {
                if (card) {
                    UI.enemyField.appendChild(createCardElement(card, true, index, 'field'));
                } else {
                    UI.enemyField.appendChild(createEmptySlotElement(index, false));
                }
            });

            // 敵本体への攻撃可否
            if (gameState.attackerIndex !== null) {
                UI.enemyHp.parentElement.parentElement.classList.add('cursor-crosshair', 'hover:bg-red-900', 'rounded-lg', 'transition');
                UI.enemyHp.parentElement.parentElement.onclick = attackEnemyHero;
            } else {
                UI.enemyHp.parentElement.parentElement.classList.remove('cursor-crosshair', 'hover:bg-red-900', 'rounded-lg', 'transition');
                UI.enemyHp.parentElement.parentElement.onclick = null;
            }

            // ターン終了ボタン
            if(gameState.turn === 'player') {
                UI.endTurnBtn.classList.remove('hidden');
            } else {
                UI.endTurnBtn.classList.add('hidden');
            }
        }

        // ランダムなカードを引く
        function drawCard(isPlayer = true) {
            const randomCard = { ...CARD_DB[Math.floor(Math.random() * CARD_DB.length)], hasAttacked: false };
            if (isPlayer) {
                if (gameState.playerHand.length < 5) {
                    gameState.playerHand.push(randomCard);
                }
            } else {
                if (gameState.enemyHandCount < 5) {
                    gameState.enemyHandCount++;
                }
            }
        }

        function startGame() {
            gameState.playerHp = 20;
            gameState.enemyHp = 20;
            gameState.playerHand = [];
            gameState.enemyHandCount = 0;
            gameState.playerField = [null, null, null];
            gameState.enemyField = [null, null, null];
            gameState.turn = 'player';
            gameState.hasPlayedCardThisTurn = false;
            gameState.selectedCardIndex = null;
            gameState.attackerIndex = null;

            // 初期ドロー
            for(let i=0; i<3; i++){ drawCard(true); drawCard(false); }
            startPlayerTurn();
        }

        function startPlayerTurn() {
            gameState.turn = 'player';
            gameState.hasPlayedCardThisTurn = false;
            gameState.selectedCardIndex = null;
            gameState.attackerIndex = null;
            
            // フィールドのカードの攻撃権を復活
            gameState.playerField.forEach(card => { if(card) card.hasAttacked = false; });
            drawCard(true);
            renderGame();
        }

        function selectCardFromHand(index) {
            if (gameState.hasPlayedCardThisTurn) {
                showMessage("制限", "1ターンにプレイできるカードは1枚までです。");
                return;
            }
            gameState.attackerIndex = null; // 攻撃選択を解除
            if (gameState.selectedCardIndex === index) {
                gameState.selectedCardIndex = null; // 選択解除
            } else {
                gameState.selectedCardIndex = index;
            }
            renderGame();
        }

        function playCardToField(fieldIndex) {
            if (gameState.selectedCardIndex === null || gameState.playerField[fieldIndex] !== null) return;

            const card = gameState.playerHand.splice(gameState.selectedCardIndex, 1)[0];
            card.hasAttacked = true; // 出したターンは攻撃不可（召喚酔い）
            gameState.playerField[fieldIndex] = card;
            gameState.selectedCardIndex = null;
            gameState.hasPlayedCardThisTurn = true;
            renderGame();
        }

        function selectCardOnFieldForAttack(index) {
            const card = gameState.playerField[index];
            if (!card || card.hasAttacked) return;

            gameState.selectedCardIndex = null; // 手札選択を解除
            if (gameState.attackerIndex === index) {
                gameState.attackerIndex = null;
            } else {
                gameState.attackerIndex = index;
            }
            renderGame();
        }

        function attackEnemyCard(enemyFieldIndex) {
            if (gameState.attackerIndex === null) return;
            
            const attacker = gameState.playerField[gameState.attackerIndex];
            const defender = gameState.enemyField[enemyFieldIndex];

            if (!attacker || !defender) return;

            // ダメージ計算 (簡易版: 攻撃力分HPを減らす)
            defender.hp -= attacker.atk;
            attacker.hasAttacked = true;
            gameState.attackerIndex = null;

            // 破壊判定
            if (defender.hp <= 0) {
                gameState.enemyField[enemyFieldIndex] = null;
            }

            renderGame();
            checkWinCondition();
        }

        function attackEnemyHero() {
            if (gameState.attackerIndex === null) return;

            // 敵のフィールドにカードがある場合は、直接攻撃できない（挑発ルールの簡易版）
            const hasEnemyCards = gameState.enemyField.some(card => card !== null);
            if (hasEnemyCards) {
                showMessage("攻撃不可", "敵のフィールドにモンスターがいるため、直接攻撃できません！");
                gameState.attackerIndex = null;
                renderGame();
                return;
            }

            const attacker = gameState.playerField[gameState.attackerIndex];
            gameState.enemyHp -= attacker.atk;
            attacker.hasAttacked = true;
            gameState.attackerIndex = null;

            renderGame();
            checkWinCondition();
        }

        async function aiTurn() {
            gameState.turn = 'enemy';
            gameState.selectedCardIndex = null;
            gameState.attackerIndex = null;
            renderGame();

            // 少し待機
            await new Promise(r => setTimeout(r, 1000));
            
            drawCard(false);

            // 1. カードを出す
            const emptySlots = gameState.enemyField.map((c, i) => c === null ? i : -1).filter(i => i !== -1);
            if (gameState.enemyHandCount > 0 && emptySlots.length > 0) {
                // ランダムに手札を消費して場に出す
                gameState.enemyHandCount--;
                const randomCard = { ...CARD_DB[Math.floor(Math.random() * CARD_DB.length)], hasAttacked: true }; // 召喚酔い
                const randomSlot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
                gameState.enemyField[randomSlot] = randomCard;
                renderGame();
                await new Promise(r => setTimeout(r, 1000));
            }

            // 2. 攻撃する
            for (let i = 0; i < gameState.enemyField.length; i++) {
                const attacker = gameState.enemyField[i];
                if (attacker && !attacker.hasAttacked) {
                    // 攻撃先を探す（プレイヤーのカードを優先）
                    const targetIndices = gameState.playerField.map((c, idx) => c !== null ? idx : -1).filter(idx => idx !== -1);
                    
                    if (targetIndices.length > 0) {
                        // ランダムなモンスターを攻撃
                        const targetIdx = targetIndices[Math.floor(Math.random() * targetIndices.length)];
                        const defender = gameState.playerField[targetIdx];
                        defender.hp -= attacker.atk;
                        if (defender.hp <= 0) {
                            gameState.playerField[targetIdx] = null;
                        }
                    } else {
                        // 直接攻撃
                        gameState.playerHp -= attacker.atk;
                    }
                    
                    attacker.hasAttacked = true;
                    renderGame();
                    
                    if (checkWinCondition()) return;
                    await new Promise(r => setTimeout(r, 800));
                }
            }

            // AIフィールドの召喚酔いを解除してプレイヤーのターンへ
            gameState.enemyField.forEach(card => { if(card) card.hasAttacked = false; });
            startPlayerTurn();
        }

        // 勝敗判定とFirestore更新
        async function checkWinCondition() {
            if (gameState.enemyHp <= 0) {
                showMessage("勝利！", "敵を打ち倒しました！", () => startGame());
                if (currentUser) {
                    // 勝利数をFirestoreに保存
                    try {
                        const userRef = doc(db, 'users', currentUser.uid);
                        await updateDoc(userRef, {
                            wins: increment(1)
                        });
                        // UI更新
                        const currentWins = parseInt(UI.userWins.textContent);
                        UI.userWins.textContent = currentWins + 1;
                    } catch (e) {
                        console.error("Failed to update wins:", e);
                    }
                }
                return true;
            } else if (gameState.playerHp <= 0) {
                showMessage("敗北...", "あなたのHPが0になりました。", () => startGame());
                return true;
            }
            return false;
        }


        UI.endTurnBtn.addEventListener('click', () => {
            if (gameState.turn === 'player') {
                aiTurn();
            }
        });

        // ログイン処理 (ポップアップ)
        UI.loginBtn.addEventListener('click', async () => {
            try {
                // サンドボックス等でブロックされるのを防ぐため念のためtry-catch
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                showMessage("ログインエラー", "環境によってポップアップがブロックされている可能性があります。GitHub Pages上であれば正常に動作します。");
            }
        });

        // ログアウト処理
        UI.logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // 認証状態の監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                UI.loginBtn.classList.add('hidden');
                UI.userInfo.classList.remove('hidden');
                UI.userName.textContent = user.displayName;
                UI.userAvatar.src = user.photoURL;
                
                // ゲーム画面のアンロック
                UI.loginOverlay.classList.add('hidden');
                UI.gameArea.classList.remove('opacity-50', 'pointer-events-none');

                // Firestoreからユーザー情報を取得・初期化
                const userRef = doc(db, 'users', user.uid);
                try {
                    const docSnap = await getDoc(userRef);
                    if (docSnap.exists()) {
                        UI.userWins.textContent = docSnap.data().wins || 0;
                    } else {
                        // 新規ユーザーの場合
                        await setDoc(userRef, {
                            displayName: user.displayName,
                            wins: 0
                        });
                        UI.userWins.textContent = "0";
                    }
                } catch (e) {
                    console.error("Firestore read/write error. Check Rules.", e);
                }

                startGame();
            } else {
                currentUser = null;
                UI.loginBtn.classList.remove('hidden');
                UI.userInfo.classList.add('hidden');
                
                // ゲーム画面のロック
                UI.loginOverlay.classList.remove('hidden');
                UI.gameArea.classList.add('opacity-50', 'pointer-events-none');
            }
        });

        // UI初期化
        renderGame();

    </script>
</body>
</html>
